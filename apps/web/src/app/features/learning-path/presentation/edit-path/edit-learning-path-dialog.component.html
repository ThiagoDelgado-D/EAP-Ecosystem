<div class="p-6 flex flex-col gap-4">
  <h2 class="text-lg font-semibold text-ink-strong">Editar Learning Path</h2>

  <div>
    <label for="edit-path-title" class="text-xs uppercase tracking-widest text-ink-faint font-medium">Título</label>
    <input
      id="edit-path-title"
      type="text"
      maxlength="200"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
      class="mt-1 w-full bg-surface-inset border border-line-soft rounded-lg px-3 py-2 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line"
    />
  </div>

  <div>
    <label for="edit-path-description" class="text-xs uppercase tracking-widest text-ink-faint font-medium"
      >Descripción (opcional)</label
    >
    <textarea
      id="edit-path-description"
      maxlength="1000"
      rows="2"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      class="mt-1 w-full bg-surface-inset border border-line-soft rounded-lg px-3 py-2 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line resize-none"
    ></textarea>
  </div>

  @if (errorMessage()) {
    <p class="text-sm text-energy-high">{{ errorMessage() }}</p>
  }

  <div class="flex justify-end gap-3">
    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 text-sm font-medium text-ink-body hover:text-ink-strong transition-colors"
    >
      Cancelar
    </button>
    <button
      type="button"
      (click)="submit()"
      [disabled]="!title().trim() || submitting()"
      class="btn btn-primary btn-sm"
    >
      {{ submitting() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</div>
