<div class="p-6 w-full max-w-md bg-surface-raised border border-line-soft rounded-xl flex flex-col gap-4">
  <h2 class="text-lg font-semibold text-ink-strong">
    {{ isEditing ? 'Editar nodo' : 'Agregar nodo' }}
  </h2>

  <div>
    <label for="node-title" class="text-xs uppercase tracking-widest text-ink-faint font-medium">Título</label>
    <input
      id="node-title"
      type="text"
      maxlength="200"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
      placeholder="Ej: Fundamentos de HTML"
      class="mt-1 w-full bg-surface-inset border border-line-soft rounded-lg px-3 py-2 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line"
    />
  </div>

  <div>
    <label for="node-description" class="text-xs uppercase tracking-widest text-ink-faint font-medium"
      >Descripción (opcional)</label
    >
    <textarea
      id="node-description"
      maxlength="1000"
      rows="2"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      class="mt-1 w-full bg-surface-inset border border-line-soft rounded-lg px-3 py-2 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line resize-none"
    ></textarea>
  </div>

  <div>
    <label for="node-external-url" class="text-xs uppercase tracking-widest text-ink-faint font-medium"
      >Link externo (opcional)</label
    >
    <input
      id="node-external-url"
      type="url"
      [ngModel]="externalUrl()"
      (ngModelChange)="externalUrl.set($event)"
      placeholder="https://..."
      class="mt-1 w-full bg-surface-inset border border-line-soft rounded-lg px-3 py-2 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line"
    />
  </div>

  @if (errorMessage()) {
    <p class="text-sm text-energy-high">{{ errorMessage() }}</p>
  }

  <div class="flex justify-end gap-3">
    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 text-sm font-medium text-ink-body hover:text-ink-strong transition-colors"
    >
      Cancelar
    </button>
    <button
      type="button"
      (click)="submit()"
      [disabled]="!title().trim() || submitting()"
      class="btn btn-primary btn-sm"
    >
      {{ submitting() ? 'Guardando...' : isEditing ? 'Guardar' : 'Agregar' }}
    </button>
  </div>
</div>
