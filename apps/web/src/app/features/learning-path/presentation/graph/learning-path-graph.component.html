<div
  #canvas
  class="relative w-full h-[600px] rounded-xl border border-line-soft bg-surface-inset overflow-hidden touch-none"
>
  <div
    class="absolute inset-0 origin-top-left"
    [style.transform]="'translate(' + transform().x + 'px, ' + transform().y + 'px) scale(' + transform().k + ')'"
  >
    <svg class="absolute inset-0 overflow-visible" width="1" height="1">
      @for (line of edgeLines(); track line.edge.id) {
        <line
          [attr.x1]="line.x1"
          [attr.y1]="line.y1"
          [attr.x2]="line.x2"
          [attr.y2]="line.y2"
          stroke="#334155"
          stroke-width="1.5"
          class="pointer-events-none"
        />
        <!-- Wider transparent hit-area on top of the thin visible line — 1.5px is too
             thin to click reliably, this makes the whole edge easy to target/delete. -->
        <line
          [attr.x1]="line.x1"
          [attr.y1]="line.y1"
          [attr.x2]="line.x2"
          [attr.y2]="line.y2"
          stroke="transparent"
          stroke-width="12"
          class="cursor-pointer"
          tabindex="0"
          role="button"
          [attr.aria-label]="'Eliminar conexión'"
          (click)="onEdgeLineClick(line.edge, $event)"
          (keydown.enter)="onEdgeLineClick(line.edge, $event)"
          (keydown.space)="onEdgeLineClick(line.edge, $event)"
        />
      }
      @if (edgeDraft(); as draft) {
        <line
          [attr.x1]="draft.x1"
          [attr.y1]="draft.y1"
          [attr.x2]="draft.x2"
          [attr.y2]="draft.y2"
          stroke="#a78bfa"
          stroke-width="1.5"
          stroke-dasharray="4 3"
          class="pointer-events-none"
        />
      }
    </svg>

    @for (entry of positionedNodes(); track entry.node.id) {
      <div
        data-node-card
        [attr.data-node-id]="entry.node.id"
        class="absolute -translate-x-1/2 -translate-y-1/2 w-[200px] touch-none"
        [style.left.px]="entry.x"
        [style.top.px]="entry.y"
        (pointerdown)="onNodePointerDown($event, entry.node, entry.x, entry.y)"
        (pointermove)="onNodePointerMove($event, entry.node)"
        (pointerup)="onNodePointerUp($event, entry.node)"
        (pointercancel)="onNodePointerCancel()"
      >
        <div
          class="relative rounded-[10px] p-3 flex items-start gap-2 bg-surface-raised transition-all cursor-grab"
          [class]="
            !entry.node.learningResourceId
              ? 'border-[1.5px] border-dashed border-line-strong'
              : 'border border-line-soft'
          "
        >
          <div
            class="w-5 h-5 rounded-full shrink-0 flex items-center justify-center border-[1.5px] mt-0.5"
            [class]="
              entry.node.progress === NODE_PROGRESS.DONE
                ? 'bg-accent/10 border-accent-line'
                : entry.node.progress === NODE_PROGRESS.IN_PROGRESS
                  ? 'bg-accent/10 border-accent-line lp-pulse-ring'
                  : 'bg-surface-raised border-line-strong'
            "
          >
            @if (entry.node.progress === NODE_PROGRESS.DONE) {
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3">
                <path d="M20 6L9 17l-5-5" />
              </svg>
            }
          </div>
          <div class="flex-1 min-w-0">
            <span
              class="flex items-center gap-1.5 flex-wrap text-[12.5px] font-bold truncate"
              [class]="entry.node.learningResourceId ? 'text-ink-strong' : 'text-ink-dim'"
            >
              {{ entry.node.title }}
            </span>
            @if (!entry.node.learningResourceId) {
              <span
                class="inline-flex items-center gap-1 text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 mt-1 rounded text-ink-faint border border-dashed border-line-strong"
              >
                Stub
              </span>
            }
          </div>

          <div
            title="Arrastrá para conectar con otro nodo"
            class="absolute -bottom-1.5 -right-1.5 w-4 h-4 rounded-full bg-surface-overlay border border-line-strong cursor-crosshair hover:bg-accent hover:border-accent-line touch-none"
            (pointerdown)="onEdgeHandlePointerDown($event, entry.node, entry.x, entry.y)"
            (pointermove)="onEdgeHandlePointerMove($event)"
            (pointerup)="onEdgeHandlePointerUp($event)"
          ></div>
        </div>
      </div>
    }
  </div>
</div>
