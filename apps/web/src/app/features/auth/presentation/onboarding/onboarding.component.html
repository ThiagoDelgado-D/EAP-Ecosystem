<div class="w-full max-w-lg">
  @switch (step()) {
    @case ('name') {
      <app-name-step (nameSubmit)="onNameSubmit($event)" />
    }
    @case ('goals') {
      <app-intake-step
        eyebrow="First, what matters to you"
        [title]="'What are you here for, ' + firstName() + '?'"
        subtitle="Pick as many as you like. We'll decide what to show you first and what to keep for later."
        [options]="GOAL_OPTIONS"
        [multiple]="true"
        [answered]="goals()"
        [skippable]="true"
        [loading]="loading()"
        [error]="error()"
        (back)="goTo('name')"
        (skip)="onSkip()"
        (answer)="onGoalsSubmit($event)"
      />
    }
    @case ('style') {
      <app-intake-step
        eyebrow="How you move"
        title="What pace works as a starting point?"
        subtitle="Only a starting point: recommendations still adjust to each day, and you can change it anytime."
        [options]="STUDY_STYLE_OPTIONS"
        [answered]="answeredStyle()"
        [loading]="loading()"
        [error]="error()"
        (back)="goTo('goals')"
        (answer)="onStyleSubmit($event)"
      />
    }
    @case ('setup') {
      @if (setup(); as setup) {
        <app-setup-step
          [firstName]="firstName()"
          [setup]="setup"
          [loading]="loading()"
          [error]="error()"
          (back)="goTo('style')"
          (confirm)="onSetupConfirm($event)"
        />
      }
    }
  }

  <app-onboarding-progress [current]="stepNumber()" [total]="STEPS.length" />
</div>
