<div class="w-full max-w-lg">
  <div class="bg-surface-raised border border-line-soft rounded-2xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <p class="text-xs font-semibold tracking-widest text-ink-faint uppercase mb-3">Step 2 of 2</p>
      <h1 class="text-2xl font-bold text-ink-strong mb-2">Build your system, {{ firstName() }}.</h1>
      <p class="text-sm text-ink-dim leading-relaxed">
        Choose which modules to activate. You can change this anytime in Settings.<br />
        Disabled modules don't load routes or make API calls.
      </p>
    </div>

    <div class="flex flex-col gap-2 mb-6">
      @for (module of modules; track module.key) {
        <button
          type="button"
          (click)="toggle(module)"
          [disabled]="module.locked"
          [attr.aria-pressed]="isOn(module.key)"
          [attr.aria-label]="module.label + (module.locked ? ' (always on)' : '')"
          [style.--tone]="toneVar(MODULE_TONE[module.key])"
          class="w-full flex items-center gap-3 px-3 py-3 rounded-xl border text-left transition-[background-color,border-color] duration-150"
          [class]="classesFor(module.key).card"
        >
          <div
            class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center border bg-surface-raised transition-[border-color,color] duration-150"
            [class]="classesFor(module.key).icon"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path [attr.d]="module.icon" />
            </svg>
          </div>

          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold" [class]="classesFor(module.key).label">{{
                module.label
              }}</span>
              @if (module.locked) {
                <span
                  class="text-xs font-semibold px-1.5 py-0.5 rounded-full border border-(--tone)/35 bg-(--tone)/10 text-(--tone)"
                  >Always on</span
                >
              }
            </div>
            <p class="text-xs text-ink-faint mt-0.5 leading-relaxed">{{ module.desc }}</p>
          </div>

          <div
            class="w-9 h-5 rounded-full relative shrink-0 transition-colors duration-200"
            [class]="classesFor(module.key).track"
            [class.opacity-50]="module.locked"
          >
            <div
              class="absolute top-0.5 left-[3px] w-3.5 h-3.5 bg-white rounded-full shadow transition-transform duration-200"
              [class.translate-x-[15px]]="isOn(module.key)"
            ></div>
          </div>
        </button>
      }
    </div>

    @if (error()) {
      <p class="text-xs text-energy-high mb-3 text-center">{{ error() }}</p>
    }

    <div class="flex gap-3">
      <button
        (click)="back.emit()"
        [disabled]="loading()"
        class="px-5 py-3 rounded-xl text-sm font-medium text-ink-dim border border-line-strong hover:border-line-strong hover:text-ink-body transition-colors disabled:opacity-50"
      >
        Back
      </button>
      <button
        (click)="submit()"
        [disabled]="loading()"
        class="btn btn-primary"
      >
        @if (loading()) {
          Setting up your space...
        } @else {
          Start learning
        }
      </button>
    </div>
  </div>

  <div class="flex justify-center items-center gap-2 mt-5">
    <div class="w-1.5 h-1.5 rounded-full bg-surface-overlay"></div>
    <div class="w-6 h-1.5 rounded-full bg-accent"></div>
  </div>
</div>
