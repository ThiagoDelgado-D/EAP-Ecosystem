<div class="bg-surface-raised border border-line-soft rounded-2xl p-8 shadow-xl">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-ink-strong mb-2">{{ title() }}</h1>
    <p class="text-sm text-ink-dim leading-relaxed">{{ subtitle() }}</p>
  </div>

  <div class="grid gap-2 sm:grid-cols-2 mb-6" [attr.role]="multiple() ? 'group' : 'radiogroup'">
    @for (option of options(); track option.key) {
      <button
        type="button"
        (click)="choose(option.key)"
        [attr.role]="multiple() ? null : 'radio'"
        [attr.aria-pressed]="multiple() ? isChosen(option.key) : null"
        [attr.aria-checked]="multiple() ? null : isChosen(option.key)"
        class="flex items-start gap-3 px-3 py-3 rounded-xl border text-left transition-[background-color,border-color] duration-150"
        [class]="
          isChosen(option.key)
            ? 'bg-accent-wash border-accent-line'
            : 'bg-surface-inset border-line-soft hover:border-line-strong'
        "
      >
        <span
          class="mt-0.5 w-4 h-4 shrink-0 rounded-full border flex items-center justify-center transition-[background-color,border-color] duration-150"
          [class]="isChosen(option.key) ? 'bg-accent border-accent' : 'border-line-strong'"
        >
          @if (isChosen(option.key)) {
            <svg
              width="9"
              height="9"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
              class="text-surface-base"
            >
              <path d="M20 6L9 17l-5-5" />
            </svg>
          }
        </span>
        <span class="min-w-0">
          <span class="block text-xs font-bold text-ink-strong">{{ option.label }}</span>
          <span class="block text-xs text-ink-faint mt-0.5 leading-relaxed">{{ option.hint }}</span>
        </span>
      </button>
    }
  </div>

  @if (error()) {
    <p class="text-xs text-energy-high mb-3 text-center">{{ error() }}</p>
  }

  <div class="flex gap-3">
    <button
      type="button"
      (click)="back.emit()"
      [disabled]="loading()"
      class="px-5 py-3 rounded-xl text-sm font-medium text-ink-dim border border-line-strong hover:text-ink-body transition-colors disabled:opacity-50"
    >
      Back
    </button>
    <button
      type="button"
      (click)="submit()"
      [disabled]="chosen().length === 0 || loading()"
      class="btn btn-primary flex-1"
    >
      @if (loading()) {
        Putting your setup together...
      } @else {
        Continue
      }
    </button>
  </div>

  @if (skippable()) {
    <button
      type="button"
      (click)="skip.emit()"
      [disabled]="loading()"
      class="block mx-auto mt-4 text-xs font-medium text-ink-faint hover:text-ink-body transition-colors disabled:opacity-50"
    >
      Skip, I'll set it up later
    </button>
  }
</div>
