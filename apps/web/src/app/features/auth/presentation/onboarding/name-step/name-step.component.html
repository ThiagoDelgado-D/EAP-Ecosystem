<div class="w-full max-w-lg">
  <div class="bg-surface-raised border border-line-soft rounded-2xl p-10 shadow-xl">
    <div class="flex flex-col items-center mb-8">
      <app-brand-mark size="hero" />
    </div>

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-ink-strong mb-1">Welcome. Let's set up your space.</h1>
      <p class="text-sm text-ink-faint leading-relaxed">What should we call you?</p>
    </div>

    <div class="mb-4">
      <label for="first-name-input" class="sr-only">First name</label>
      <input
        id="first-name-input"
        type="text"
        placeholder="Your first name"
        [(ngModel)]="nameValue"
        (keydown.enter)="submit()"
        class="w-full bg-surface-overlay border border-line-strong rounded-xl px-4 py-3 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line transition-colors"
      />
    </div>

    <button
      (click)="submit()"
      [disabled]="!isValid()"
      class="btn btn-primary w-full"
    >
      Continue
    </button>
  </div>
</div>
