<div class="w-full max-w-lg">
  <div class="bg-surface-raised border border-line-soft rounded-2xl p-10 shadow-xl">
    <div class="flex flex-col items-center mb-8">
      <div
        class="w-14 h-14 bg-accent rounded-2xl flex items-center justify-center mb-3 shadow-lg"
      >
        <svg
          class="w-7 h-7 text-surface-base"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>
      <span class="text-ink-strong font-bold text-lg leading-none">EAP</span>
      <span class="text-accent-ink text-xs tracking-widest font-medium mt-0.5">ECOSYSTEM</span>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-ink-strong mb-1">Welcome. Let's set up your space.</h1>
      <p class="text-sm text-ink-faint leading-relaxed">What should we call you?</p>
    </div>

    <div class="mb-4">
      <label for="first-name-input" class="sr-only">First name</label>
      <input
        id="first-name-input"
        type="text"
        placeholder="Your first name"
        [(ngModel)]="nameValue"
        (keydown.enter)="submit()"
        class="w-full bg-surface-overlay border border-line-strong rounded-xl px-4 py-3 text-sm text-ink-strong placeholder:text-ink-faint focus:outline-none focus:border-accent-line transition-colors"
      />
    </div>

    <button
      (click)="submit()"
      [disabled]="!isValid()"
      class="btn btn-primary w-full"
    >
      Continue
    </button>
  </div>

  <div class="flex justify-center items-center gap-2 mt-5">
    <div class="w-6 h-1.5 rounded-full bg-accent"></div>
    <div class="w-1.5 h-1.5 rounded-full bg-surface-overlay"></div>
  </div>
</div>
