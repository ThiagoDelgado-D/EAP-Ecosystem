<div class="w-full max-w-lg">
  <div class="bg-surface-raised border border-line-soft rounded-2xl p-10 shadow-xl">
    <div class="flex flex-col items-center mb-6">
      <div
        class="w-14 h-14 bg-accent rounded-2xl flex items-center justify-center mb-3 shadow-lg"
      >
        <svg
          class="w-7 h-7 text-surface-base"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>
      <span class="text-ink-strong font-bold text-lg leading-none">EAP</span>
      <span class="text-accent-ink text-xs tracking-widest font-medium mt-0.5">ECOSYSTEM</span>
    </div>

    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-ink-strong mb-1">Check your inbox.</h1>
      <p class="text-sm text-ink-faint leading-relaxed">
        We sent a 6–digit code to <strong class="text-ink-body">{{ email() }}</strong
        >.<br />
        It expires in 10 minutes.
      </p>
    </div>

    <div class="flex gap-2 justify-center mb-4" (paste)="onPaste($event)">
      @for (digit of digits(); track $index; let i = $index) {
        <input
          #codeInput
          type="text"
          inputmode="numeric"
          maxlength="1"
          [value]="digit"
          (input)="onDigitInput(i, $event)"
          (keydown)="onKeyDown(i, $event)"
          [attr.aria-label]="'Digit ' + ($index + 1) + ' of the code'"
          class="w-11 h-12 text-center text-xl font-bold bg-surface-overlay border border-line-strong rounded-xl text-ink-strong focus:outline-none focus:border-accent-line transition-colors caret-transparent"
        />
      }
    </div>

    @if (error()) {
      <p class="text-xs text-energy-high text-center mb-3">{{ error() }}</p>
    }

    <button
      (click)="submit()"
      [disabled]="!isComplete() || loading()"
      class="w-full bg-surface-overlay hover:bg-surface-overlay border border-line-strong text-ink-strong font-medium py-3 rounded-xl text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed mb-4"
    >
      @if (loading()) {
        Verifying...
      } @else {
        Verify code
      }
    </button>

    <div class="flex justify-between items-center">
      <button
        (click)="changeEmail.emit()"
        [disabled]="loading()"
        class="flex items-center gap-1 text-xs text-ink-faint hover:text-ink-body transition-colors"
      >
        <svg
          class="w-3 h-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Change email
      </button>
      <button
        (click)="resend()"
        [disabled]="loading() || resendSeconds() > 0"
        class="text-xs text-ink-faint hover:text-ink-body disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        @if (resendSeconds() > 0) {
          Resend in {{ resendSeconds() }}s
        } @else {
          Resend code
        }
      </button>
    </div>
  </div>

  <div class="flex justify-center items-center gap-2 mt-5">
    <div class="w-1.5 h-1.5 rounded-full bg-surface-overlay"></div>
    <div class="w-6 h-1.5 rounded-full bg-accent"></div>
    <div class="w-1.5 h-1.5 rounded-full bg-surface-overlay"></div>
  </div>
</div>
