<div class="card card-alt p-5 h-full">
  <p class="eyebrow">Calibrate the engine</p>

  <div class="mt-3 flex flex-col gap-1.5">
    @for (option of energyOptions; track option.value) {
      <button
        type="button"
        (click)="selectEnergy(option.value)"
        class="group flex items-center gap-3 rounded-[16px_5px_16px_5px] border p-2.5 text-left transition-all duration-300"
        [class.border-transparent]="selectedEnergy() === option.value"
        [class.border-line-soft]="selectedEnergy() !== option.value"
        [style]="selectedEnergy() === option.value ? option.activeStyle : null"
      >
        <span class="flex gap-0.5">
          @for (n of [1, 2, 3]; track n) {
            <span
              class="h-5 w-1.5 rounded-full transition-all duration-300"
              [style.background]="n <= option.level ? option.tone : 'var(--color-line-soft)'"
            ></span>
          }
        </span>
        <span class="min-w-0 flex-1">
          <span class="block text-[0.86rem] font-semibold text-ink-strong">Energy {{ option.label.toLowerCase() }}</span>
          <span class="block text-[0.7rem] text-ink-dim">{{ option.hint }}</span>
        </span>
      </button>
    }
  </div>

  <div class="mt-4">
    <p class="text-[0.7rem] uppercase tracking-[0.12em] font-bold text-ink-dim mb-1.5">Available time</p>
    <div class="flex flex-wrap gap-1.5">
      @for (minutes of availableMinutesOptions(); track minutes) {
        <button
          type="button"
          (click)="selectAvailableMinutes(minutes)"
          class="chip"
          [attr.data-on]="selectedAvailableMinutes() === minutes || undefined"
        >
          <span class="tnum">{{ minutes }}</span> min
        </button>
      }
    </div>
  </div>

  <div class="mt-4">
    <p class="text-[0.7rem] uppercase tracking-[0.12em] font-bold text-ink-dim mb-1.5">Mental state</p>
    <div class="flex flex-wrap gap-1.5">
      @for (option of mentalStateOptions; track option.value) {
        <button
          type="button"
          (click)="selectMentalState(option.value)"
          class="chip"
          [attr.data-on]="selectedMentalState() === option.value || undefined"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </div>
</div>
