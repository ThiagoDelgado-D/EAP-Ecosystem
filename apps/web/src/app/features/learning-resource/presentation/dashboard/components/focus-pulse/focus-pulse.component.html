<div class="border border-line-hairline rounded-xl p-4 sm:p-[18px]">
  <div class="flex items-start justify-between mb-4">
    <div>
      <p class="t-kicker mb-1">Focus Pulse</p>
      <div class="flex items-baseline gap-1">
        <span class="t-num text-[34px]">
          {{ weeklyEfficiency }}
        </span>
        <span class="font-mono text-base font-light text-ink-faint">%</span>
      </div>
      <p class="text-[10.5px] text-ink-faint mt-1">Weekly Efficiency</p>
    </div>

    <div class="flex items-end gap-1 h-12">
      @for (bar of weeklyBars; track $index) {
        <div
          class="w-2 rounded-[1px] transition-all duration-300"
          [style.height.%]="bar"
          [class]="$index === todayIndex ? 'bg-accent-hover' : 'bg-line-soft'"
        ></div>
      }
    </div>
  </div>

  <div>
    <div class="flex justify-between items-center mb-2">
      <span class="t-kicker">
        Energy Level Flow
      </span>
      <span class="font-mono text-[10.5px] font-medium text-status-done">Optimal Range</span>
    </div>

    <div class="relative h-1.5 bg-surface-inset border border-line-hairline rounded-full overflow-hidden">
      <div
        class="absolute inset-y-0 left-0 bg-gradient-to-r from-accent to-status-done rounded-full"
        [style.width.%]="flowFill"
      ></div>
      <div
        class="absolute inset-y-0 right-0 w-2/5 bg-status-done/15 border-l border-status-done/30"
      ></div>
    </div>

    <div class="grid grid-cols-3 mt-3">
      <div>
        <p class="t-mono text-sm text-ink-body">{{ amPeak }}</p>
        <p class="text-[10.5px] text-ink-faint">AM Peak</p>
      </div>
      <div class="text-center">
        <p class="font-mono text-[13px] font-medium text-status-done">{{ current }}</p>
        <p class="text-[10.5px] text-ink-faint">Current</p>
      </div>
      <div class="text-right">
        <p class="t-mono text-sm text-ink-body">{{ pmDip }}</p>
        <p class="text-[10.5px] text-ink-faint">PM Dip</p>
      </div>
    </div>
  </div>
</div>
