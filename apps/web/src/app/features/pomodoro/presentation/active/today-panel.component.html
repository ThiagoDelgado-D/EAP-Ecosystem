<div class="flex flex-col gap-4">
  <div>
    <p class="t-kicker mb-1">Today</p>
    <p class="text-xl font-extrabold text-ink-strong">{{ totalLabel() }} focused</p>
  </div>

  @if (loading()) {
    <div class="text-xs text-ink-faint">Loading...</div>
  } @else {
    <div class="relative" [style.height.px]="dayHeightPx">
      @for (mark of hourMarks; track mark.label) {
        <div class="absolute left-0 right-0 flex items-start gap-2" [style.top.px]="mark.topPx">
          <span class="text-[9px] text-ink-ghost font-semibold -translate-y-1/2" [style.width.px]="HOUR_GUTTER_PX">{{ mark.label }}</span>
          <div class="flex-1 border-t border-line-hairline"></div>
        </div>
      }

      <div class="absolute right-0 border-t-2 border-energy-high z-10" [style.top.px]="nowTopPx" [style.left.px]="HOUR_GUTTER_PX + 8">
        <span class="absolute -left-1 -top-[3px] w-1.5 h-1.5 rounded-full bg-energy-high"></span>
      </div>

      @for (block of blocks(); track block.key) {
        <div
          class="absolute rounded-md px-1.5 py-0.5 overflow-hidden border"
          [class]="block.kind === 'focus' ? 'bg-accent-wash border-accent-line' : 'bg-status-done/15 border-status-done/40'"
          [title]="block.label"
          [style.top.px]="block.topPx"
          [style.height.px]="block.heightPx"
          [style.left.px]="HOUR_GUTTER_PX + 8"
          [style.right.px]="4"
          [style.opacity]="block.ongoing ? 0.7 : 1"
        >
          @if (block.heightPx >= 20) {
            <span
              class="text-[9px] font-semibold leading-tight"
              [class]="block.kind === 'focus' ? 'text-accent-ink' : 'text-status-done'"
            >
              {{ block.label }}
            </span>
          }
        </div>
      }
    </div>
  }
</div>
