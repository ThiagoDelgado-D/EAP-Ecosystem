<div>
  <div class="flex flex-col divide-y divide-energy-high/30 rounded-xl border border-energy-high/50 bg-energy-high/10">

    <!-- Reset Preferences -->
    <div class="flex items-start justify-between gap-4 p-4">
      <div>
        <p class="text-sm font-medium text-ink-strong">Reset preferences</p>
        <p class="text-xs text-ink-faint mt-0.5">
          Clears all enabled modules and dashboard widget configuration.
        </p>
      </div>
      <button
        type="button"
        (click)="resetPreferences()"
        [disabled]="saving()"
        class="shrink-0 text-xs font-medium text-energy-high border border-energy-high/60 rounded-lg px-3 py-1.5 hover:bg-energy-high/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Reset
      </button>
    </div>

    <!-- Revoke all other sessions -->
    <div class="flex items-start justify-between gap-4 p-4">
      <div>
        <p class="text-sm font-medium text-ink-strong">Sign out all other devices</p>
        <p class="text-xs text-ink-faint mt-0.5">
          Terminates all active sessions except your current one.
        </p>
      </div>
      <button
        type="button"
        (click)="revokeAllOtherSessions()"
        class="shrink-0 text-xs font-medium text-energy-high border border-energy-high/60 rounded-lg px-3 py-1.5 hover:bg-energy-high/10 transition-colors"
      >
        Sign out others
      </button>
    </div>

    <!-- Delete account -->
    <div class="flex items-start justify-between gap-4 p-4">
      <div>
        <p class="text-sm font-medium text-ink-strong">Delete account</p>
        <p class="text-xs text-ink-faint mt-0.5">
          Permanently deletes your account and all associated data.
        </p>
      </div>
      <button
        type="button"
        (click)="deleteAccount()"
        class="shrink-0 text-xs font-medium text-energy-high border border-energy-high/60 rounded-lg px-3 py-1.5 hover:bg-energy-high/10 transition-colors"
      >
        Delete account
      </button>
    </div>

  </div>
</div>
