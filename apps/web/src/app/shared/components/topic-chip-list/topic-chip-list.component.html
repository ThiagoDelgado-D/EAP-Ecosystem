<div class="flex flex-wrap gap-2">
  @for (topic of topics; track topic.id) {
    <button
      type="button"
      (click)="toggled.emit(topic.id)"
      [attr.aria-pressed]="isSelected(topic.id)"
      [attr.aria-label]="'Toggle topic ' + topic.name"
      [class]="
        isSelected(topic.id)
          ? 'bg-ink-strong text-surface-base border-ink-strong'
          : 'bg-surface-overlay text-ink-body border-line-strong hover:border-line-strong'
      "
      class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors"
    >
      {{ topic.name }}
    </button>
  }
</div>
