@if (isOpen()) {
  <div class="fixed inset-0 z-[80] flex items-start justify-center px-4 pt-[12vh]">
    <button
      type="button"
      tabindex="-1"
      aria-label="Close search"
      class="absolute inset-0 cursor-default bg-ink-strong/40 backdrop-blur-[3px]"
      (click)="close()"
    ></button>

    <div
      role="dialog"
      aria-modal="true"
      aria-label="Command palette"
      class="relative w-full max-w-xl overflow-hidden rounded-[24px_24px_24px_8px] border border-line-soft bg-surface-raised shadow-[var(--shadow-lift)]"
    >
      <div class="flex items-center gap-3 border-b border-line-soft px-4 py-3">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-ink-dim">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          #searchInput
          type="text"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="true"
          aria-controls="command-palette-results"
          [attr.aria-activedescendant]="activeItemId() ? 'command-' + activeItemId() : null"
          [value]="query()"
          (input)="onQueryInput(searchInput.value)"
          (keydown)="onInputKeydown($event)"
          placeholder="Search or run a command…"
          class="flex-1 bg-transparent text-[0.95rem] text-ink-strong outline-none placeholder:text-ink-dim"
        />
        <kbd class="rounded-md border border-line-soft bg-surface-overlay px-1.5 py-0.5 font-mono text-[0.62rem] text-ink-dim">esc</kbd>
      </div>

      <div #resultList id="command-palette-results" role="listbox" class="max-h-[52vh] overflow-y-auto p-2">
        @for (section of groups(); track section.group) {
          <div role="group" [attr.aria-label]="section.group" class="mb-1">
            <p class="px-3 pt-2 pb-1 text-[0.6rem] font-bold uppercase tracking-[0.16em] text-ink-faint">
              {{ section.group }}
            </p>
            @for (entry of section.entries; track entry.item.id) {
              <button
                type="button"
                role="option"
                tabindex="-1"
                [id]="'command-' + entry.item.id"
                [attr.data-position]="entry.position"
                [attr.aria-selected]="entry.position === cursor()"
                (mouseenter)="highlight(entry.position)"
                (focus)="highlight(entry.position)"
                (click)="runItem(entry.item)"
                class="flex w-full items-center gap-3 rounded-[14px_4px_14px_4px] px-3 py-2 text-left transition-colors"
                [class.bg-surface-overlay]="entry.position === cursor()"
              >
                <span
                  class="grid h-7 w-7 shrink-0 place-items-center rounded-[10px_3px_10px_3px]"
                  [class]="entry.position === cursor() ? 'bg-accent text-surface-base' : 'bg-surface-overlay text-ink-dim'"
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    @switch (entry.item.icon) {
                      @case ('dashboard') {
                        <circle cx="12" cy="12" r="9" />
                        <path d="m15.5 8.5-2 5-5 2 2-5z" />
                      }
                      @case ('library') {
                        <path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6.5A2.5 2.5 0 0 0 4 21.5" />
                        <path d="M8 7h6" />
                      }
                      @case ('route') {
                        <circle cx="6" cy="19" r="2" />
                        <circle cx="18" cy="5" r="2" />
                        <path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16" />
                      }
                      @case ('node') {
                        <circle cx="12" cy="12" r="3" />
                        <path d="M12 3v6M12 15v6M3 12h6M15 12h6" />
                      }
                      @case ('timer') {
                        <circle cx="12" cy="13" r="8" />
                        <path d="M12 9v4l2 2M10 2h4" />
                      }
                      @case ('chart') {
                        <path d="M6 20v-6M12 20V8M18 20v-9" />
                      }
                      @case ('settings') {
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
                      }
                      @case ('plus') {
                        <path d="M12 5v14M5 12h14" />
                      }
                      @case ('link') {
                        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
                        <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
                      }
                      @case ('mic') {
                        <rect x="9" y="2" width="6" height="12" rx="3" />
                        <path d="M19 10a7 7 0 0 1-14 0M12 17v5" />
                      }
                      @case ('file') {
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3" />
                      }
                      @case ('sun') {
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                      }
                      @case ('moon') {
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                      }
                      @default {
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                      }
                    }
                  </svg>
                </span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-[0.86rem] font-medium text-ink-strong">{{ entry.item.label }}</span>
                  @if (entry.item.detail) {
                    <span class="block truncate text-[0.7rem] text-ink-dim">{{ entry.item.detail }}</span>
                  }
                </span>
                @if (entry.position === cursor()) {
                  <span class="text-[0.62rem] font-semibold text-ink-dim" aria-hidden="true">↵</span>
                }
              </button>
            }
          </div>
        } @empty {
          <p class="px-3 py-8 text-center text-sm text-ink-dim">No results for “{{ query() }}”.</p>
        }
      </div>

      <div class="flex items-center justify-between border-t border-line-soft bg-surface-overlay px-4 py-2 text-[0.66rem] text-ink-dim">
        <span class="flex items-center gap-3">
          <span>↑↓ navigate</span>
          <span>↵ open</span>
          <span>esc close</span>
        </span>
        <span class="hidden sm:inline">{{ items().length }} {{ items().length === 1 ? 'result' : 'results' }}</span>
      </div>
    </div>
  </div>
}
